# Home network (NAS / home server) deployment, plain HTTP on port 5858.
# For a server reachable from the internet use docker-compose.public.yml.
services:
  nook:
    build:
      context: .
      args:
        # true = also install rembg so the server can cut out photos when
        # a device can't do it on-device.
        WITH_CUTOUT: "${WITH_CUTOUT:-false}"
    image: nook-server:latest
    container_name: nook-server
    restart: unless-stopped
    ports:
      - "${NOOK_PORT:-5858}:5858"
    env_file:
      - path: .env
        required: false
    volumes:
      - nook-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: "${NOOK_MEM_LIMIT:-2g}"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  nook-data:
